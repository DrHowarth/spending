        data: days.map(d => [tsOf(d.date), d.bal == null ? null : d.bal / 100]),
        lineStyle: { width: 1.6, color: blue }, itemStyle: { color: blue },
        areaStyle: { color: new echarts.graphic.LinearGradient(0, 0, 0, 1, [{ offset: 0, color: 'rgba(59,110,245,.16)' }, { offset: 1, color: 'rgba(59,110,245,0)' }]) } },
      { type: 'scatter', symbolSize: 8, z: 5, itemStyle: { color: '#17905a', borderColor: '#fff', borderWidth: 1.5 }, tooltip: { show: false },
        data: state.view.paydays ? state.paydays.map(t => [tsOf(t.date), dayEnd.get(t.date) / 100]) : [] }],
  }, true);
  $('#payBtn').classList.toggle('on', state.view.paydays);
  chart.dispatchAction({ type: 'takeGlobalCursor', key: 'brush', brushOption: { brushType: 'lineX', brushMode: 'single' } });
  // a rebuild (paydays switched, folder re-read) keeps a hand-dragged window instead of jumping to a preset
  if (state.view.preset || !state.view.range) applyPreset(state.view.preset || 'All');
  else chart.dispatchAction({ type: 'dataZoom', dataZoomIndex: 0, startValue: tsOf(state.view.range.from), endValue: tsOf(state.view.range.to) });
}

// A sweep shorter than a day is a click (handled by jumpToDate), not a selection.
function onBrushEnd(e) {
  const area = e.areas && e.areas[0];
  chart.dispatchAction({ type: 'brush', areas: [] });
  if (!area || !area.coordRange) return;
  const [a, b] = area.coordRange.map(Number);
  if (Math.abs(b - a) < DAY) return;
  chart.dispatchAction({ type: 'dataZoom', dataZoomIndex: 0, startValue: Math.min(a, b), endValue: Math.max(a, b) });
}

// Two-finger sideways swipe pans; pinch (ctrl+wheel) is ECharts' own zoom; plain up/down scroll is left to the page.
function onSwipe(e) {
  if (e.ctrlKey || Math.abs(e.deltaX) <= Math.abs(e.deltaY)) return;
  e.preventDefault();
  const dz = chart.getOption().dataZoom[0], width = dz.end - dz.start;
  const shift = e.deltaX / $('#chart').clientWidth * width;
  const start = Math.min(Math.max(dz.start + shift, 0), 100 - width);
  chart.dispatchAction({ type: 'dataZoom', dataZoomIndex: 0, start, end: start + width });
}

function tip(params) {
  const p = params.find(x => x.seriesIndex === 0);
  if (!p || p.value[1] == null) return '';
  const iso = isoOf(p.value[0]), list = state.byDay.get(iso) || [];
  const isPay = state.view.paydays && state.paydays.some(t => t.date === iso);
  let h = `<div class="tip"><b>${WEEKDAY[new Date(p.value[0]).getUTCDay()]} ${shortDate(iso)}${isPay ? ' · payday' : ''}</b><span class="bal">£${Core.fmt(Math.round(p.value[1] * 100))}</span>`;
  if (list.length) {
    h += '<table>' + list.slice(0, 6).map(t => `<tr><td>${esc(showLines(t)[0] || TYPES[t.type] || t.type)}</td><td class="a ${t.amount > 0 ? 'in' : ''}">${Core.fmt(t.amount, true)}</td></tr>`).join('') + '</table>';
    if (list.length > 6) h += `<div class="more">and ${list.length - 6} more</div>`;
  }
  return h + '</div>';
}

function applyPreset(key) {
  if (!chart) return;
  const r = Core.presetRange(isoOf(chartLast), key);
  presetting = true;
  chart.dispatchAction({ type: 'dataZoom', dataZoomIndex: 0, startValue: r ? Math.max(tsOf(r.from), chartFirst) : chartFirst, endValue: chartLast });
  clearTimeout(zoomT);                                  // the chart's own echo of this action would clear the preset
  state.view.preset = key; ls.set('preset', key);
  readZoom();
}

// window (as % of the whole axis) -> whole days -> state.view.range -> every tile
function readZoom() {
  const dz = chart.getOption().dataZoom[0], span = chartLast - chartFirst;
  const from = isoOf(Math.round((chartFirst + span * dz.start / 100) / DAY) * DAY);
  const to = isoOf(Math.round((chartFirst + span * dz.end / 100) / DAY) * DAY);
  if (!presetting) state.view.preset = null;
  presetting = false;
  document.querySelectorAll('#presets button').forEach(b => b.classList.toggle('on', b.dataset.p === state.view.preset));
  const all = dz.start <= 0.01 && dz.end >= 99.99;
  const next = all ? null : { from, to };
  $('#rangeLbl').textContent = `${shortDate(from)} – ${shortDate(to)}`;
  if (JSON.stringify(next) === JSON.stringify(state.view.range)) return;
  state.view.range = next;
  buildRows();
  buildCats();
  buildCharts();
}

function jumpToDate(iso) {
  const rows = state.view.rows;
  if (!rows.length) return;
  let i = rows.findIndex(t => state.view.desc ? t.date <= iso : t.date >= iso);
  if (i < 0) i = rows.length - 1;
  state.view.sel = rows[i].key;
  $('#txList').scrollTop = i * ROW;
  drawRows();
}

// ---------- Categories ----------
// Everything Barry decides lives in state.data (spending-data.json): rules {payeeKey -> cat} and
// tags {txKey -> {cat, labels}}. state.catOf is derived from it and rebuilt after every change.
const catById = id => id && state.data.categories.find(c => c.id === id);
// new categories take colours unlike the 16 starters
const SPARE_COLOURS = ['#00bcd4', '#9c27b0', '#cddc39', '#3f51b5', '#ff7043', '#f06292', '#00e676', '#ffca28', '#8d6e63', '#26a69a', '#ab47bc', '#78909c'];
function newCategory(name) {
  const used = new Set(state.data.categories.map(c => c.color));
  const color = SPARE_COLOURS.find(c => !used.has(c)) || SPARE_COLOURS[state.data.categories.length % SPARE_COLOURS.length];
  const cat = { id: 'c' + Date.now().toString(36), name: name.trim(), color };
  state.data.categories.push(cat);
  return cat;
}
// Deleting a category sends its payees and single choices back to their first guess or to uncategorised.
function deleteCategory(id) {
  const c = catById(id); if (!c) return;
  const rules = Object.keys(state.data.rules).filter(k => state.data.rules[k] === id);
  const tags = Object.keys(state.data.tags).filter(k => state.data.tags[k].cat === id);
  if (!confirm(`Delete "${c.name}"?` + (rules.length + tags.length ? ` ${rules.length} payee${rules.length === 1 ? '' : 's'} and ${tags.length} single choice${tags.length === 1 ? '' : 's'} using it will go back to their first guess or to uncategorised.` : ''))) return;
  rules.forEach(k => delete state.data.rules[k]);
  tags.forEach(k => setTag(k, { cat: null }));
  state.data.categories = state.data.categories.filter(x => x.id !== id);
  state.chartHidden.delete(id);
  changed();
}
const catName = t => { const c = catById((state.catOf.get(t.key) || {}).cat); return c ? c.name : ''; };

function computeCats() {
  state.catOf = new Map();
  if (!state.merged) return;
  for (const t of state.merged.tx) state.catOf.set(t.key, Core.categoryOf(t, state.data));
  state.refunds = Core.findRefunds(state.merged.tx);
}

let saveT;
function changed() {
  computeCats(); drawRows(); buildCats(); buildCharts();
  clearTimeout(saveT); saveT = setTimeout(() => saveData().catch(e => toast('Not saved: ' + e.message)), 400);
}

function ruleWithUndo(key, cat) {
  const before = state.data.rules[key] || null;
  setRule(key, cat); changed();
  const c = catById(cat);
  toast(`${key} → ${c ? c.name : 'no category'}`, () => { setRule(key, before); changed(); toast(`${key}: undone`); });
}
function setRule(key, cat) { if (cat) state.data.rules[key] = cat; else delete state.data.rules[key]; }
function setTag(txKey, patch) {
  const tag = { ...(state.data.tags[txKey] || {}), ...patch };
  if (!tag.cat) delete tag.cat;
  if (!tag.labels || !tag.labels.length) delete tag.labels;
  if (Object.keys(tag).length) state.data.tags[txKey] = tag; else delete state.data.tags[txKey];
}

let pickFor = null;
function openPicker(t, anchor) {
  pickFor = t;
  const k = Core.payeeKey(t), cur = state.catOf.get(t.key) || {}, tag = state.data.tags[t.key] || {};
  const el = $('#picker');
  el.innerHTML = `<div class="who">${esc(showLines(t)[0] || TYPES[t.type] || t.type)} · ${shortDate(t.date)} · ${Core.fmt(t.amount, true)}</div>`
    + `<div class="grid">${state.data.categories.map(c => `<button data-cat="${c.id}" class="${cur.cat === c.id ? 'on' : ''}"><span class="cdot" style="background:${c.color}"></span>${esc(c.name)}</button>`).join('')}<button class="new" id="pkNew">+ New</button></div>`
    + `<div class="newcat hidden" id="pkNewRow"><input type="text" id="pkNewName" placeholder="New category name"><button id="pkNewAdd">Add</button></div>`
    + (k ? `<label><input type="checkbox" id="pkAll" ${tag.cat ? '' : 'checked'}> All from ${esc(k)}</label>` : '<label style="color:var(--muted)">This payee is hidden by the bank, so this sets one entry.</label>')
    + `<input type="text" id="pkLabels" placeholder="Labels, e.g. holiday 2024" value="${esc((tag.labels || []).join(', '))}">`
    + `<div class="foot"><button id="pkClear">Clear</button><button id="pkDone">Done</button></div>`;
  el.classList.remove('hidden');
  const r = anchor.getBoundingClientRect(), w = el.offsetWidth, h = el.offsetHeight;
  el.style.left = Math.max(8, Math.min(r.left - 8, innerWidth - w - 8)) + 'px';
  el.style.top = (r.bottom + 6 + h > innerHeight ? Math.max(8, r.top - h - 6) : r.bottom + 6) + 'px';
}
function closePicker() { saveLabels(); $('#picker').classList.add('hidden'); pickFor = null; }
function saveLabels() {
  if (!pickFor || !$('#pkLabels')) return;
  const labels = $('#pkLabels').value.split(',').map(s => s.trim()).filter(Boolean);
  const before = JSON.stringify((state.data.tags[pickFor.key] || {}).labels || []);
  if (JSON.stringify(labels) !== before) { setTag(pickFor.key, { labels }); changed(); }
}
$('#picker').addEventListener('click', e => {
  const t = pickFor; if (!t) return;
  const b = e.target.closest('button'); if (!b) return;
  const all = $('#pkAll') && $('#pkAll').checked, k = Core.payeeKey(t);
  if (b.id === 'pkNew') { $('#pkNewRow').classList.remove('hidden'); $('#pkNewName').focus(); return; }
  if (b.id === 'pkNewAdd') { const n = $('#pkNewName').value.trim(); if (!n) return; b.dataset.cat = newCategory(n).id; }
  if (b.dataset.cat) {
    if (all && k) { setRule(k, b.dataset.cat); setTag(t.key, { cat: null }); }
    else setTag(t.key, { cat: b.dataset.cat });
    saveLabels(); changed(); closePicker();
  } else if (b.id === 'pkClear') {
    setTag(t.key, { cat: null }); if (all && k) setRule(k, null);
    saveLabels(); changed(); closePicker();
  } else if (b.id === 'pkDone') closePicker();
});
$('#picker').addEventListener('keydown', e => { if (e.key !== 'Enter') return; if (e.target.id === 'pkNewName') $('#pkNewAdd').click(); else closePicker(); });
document.addEventListener('mousedown', e => { if (pickFor && !e.target.closest('#picker') && !e.target.closest('.cdot')) closePicker(); });

// The Categories tile: payees still to sort (biggest spend first, in the timeline's range), and the list.
// The payments behind one payee's line in "Sort payees", newest first.
function payeeSubList(key, tx) {
  const rows = tx.filter(t => Core.payeeKey(t) === key).reverse();
  state.catView.subRows.set(key, rows);
  const shown = state.catView.expanded.get(key);
  return `<div class="psub" data-k="${esc(key)}">` + rows.slice(0, shown).map((t, i) => {
    const partner = state.catView.refunds && state.refunds.get(t.key);
    return `<div class="cp-r ${t.src} ${partner ? 'refund' : ''}" data-i="${i}" title="${t.src === 'pdf' ? 'Show on statement' : 'From CSV'}">`
      + `<span class="d">${shortDate(t.date)}</span>`
      + `<span class="nm">${(L => L.length ? esc(L[0]) + (L.length > 1 ? `<i>${esc(L.slice(1).join(' · '))}</i>` : '') : esc(TYPES[t.type] || t.type))(showLines(t))}</span>`
      + `<span class="a ${t.amount > 0 ? 'in' : ''}">${Core.fmt(t.amount, true)}</span></div>`;
  }).join('') + (rows.length > shown ? `<button class="more" data-sub="${esc(key)}">Show ${Math.min(50, rows.length - shown)} more of ${rows.length - shown}</button>` : '') + `</div>`;
}

function buildCats() {
  const body = $('#catBody'); if (!state.merged) return;
  const tx = Core.inRange(state.merged.tx, state.view.range);
  const todo = Core.payeeSummary(tx, state.data).filter(p => p.src !== 'rule');
  const unsortedRows = tx.filter(t => { const c = state.catOf.get(t.key); return !c || c.src === 'none' || c.src === 'guess'; }).length;
  $('#sortCount').textContent = todo.length ? todo.length.toLocaleString('en-GB') : '';
  $('#refundBtn').classList.toggle('on', state.catView.refunds);
  document.querySelectorAll('#catTabs button').forEach(b => b.classList.toggle('on', b.dataset.t === state.catView.tab));
  const opts = sel => `<option value="">—</option>` + state.data.categories.map(c => `<option value="${c.id}" ${c.id === sel ? 'selected' : ''}>${esc(c.name)}</option>`).join('');
  if (state.catView.tab === 'sort') {
    if (!todo.length) { body.innerHTML = '<div class="empty-note">Every payee in this range has a category.</div>'; return; }
    state.catView.subRows = new Map();
    body.innerHTML = `<div class="sort-hint">The app has guessed these payees. ✓ keeps the guess, or pick another. Sorted payees leave this list and stay in their category. Click a payee to see its payments.</div>` + todo.slice(0, state.catView.shown).map(p => {
      const c = catById(p.cat), open = state.catView.expanded.has(p.key);
      return `<div class="prow ${open ? 'open' : ''}" data-k="${esc(p.key)}"><span class="cdot ${c ? 'guess' : 'none'}" style="background:${c ? c.color : 'transparent'}"></span>`
        + `<span class="nm" title="${esc(p.key)}"><svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>${esc(p.key)}</span>`
        + `<span class="st">${p.n} payment${p.n === 1 ? '' : 's'}${p.out ? ` · £${Core.fmt(p.out)} out` : ''}${p.inn ? ` · <span class="in">£${Core.fmt(p.inn)} in</span>` : ''}</span>`
        + `<select>${opts(p.cat)}</select>`
        + (c ? `<button class="ok" title="Keep ${esc(c.name)}"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12 5 5 9-10"/></svg></button>` : '<span></span>')
        + `</div>` + (open ? payeeSubList(p.key, tx) : '');
    }).join('') + (todo.length > state.catView.shown ? `<button class="more" id="moreBtn">Show more (${todo.length - state.catView.shown} left · ${unsortedRows.toLocaleString('en-GB')} entries unconfirmed)</button>` : '');
  } else if (state.catView.editing) {
    body.innerHTML = `<div class="chips">${state.data.categories.map(c => `<span class="chip" data-id="${c.id}"><input type="color" value="${c.color}" title="Colour"><input type="text" value="${esc(c.name)}" title="Rename"><button class="del" title="Delete">×</button></span>`).join('')}`
      + `<button class="chip" id="addCat">+ Add</button></div><button class="editbtn" id="editCats">Done</button>`;
  } else {
    const tot = catTotals(tx);
    const list = [...state.data.categories.map(c => ({ id: c.id, name: c.name, color: c.color })), { id: '', name: 'Uncategorised', color: null }]
      .map(c => ({ ...c, ...(tot.get(c.id) || { n: 0, out: 0, inn: 0 }) }))
      .filter(c => c.n || c.id)
      .sort((a, b) => b.out - a.out || b.inn - a.inn || b.n - a.n);
    body.innerHTML = list.map(c => `<div class="crow ${c.n ? '' : 'zero'}" data-cat="${c.id}"><span class="cdot ${c.color ? '' : 'none'}" style="background:${c.color || 'transparent'}"></span>`
      + `<span>${esc(c.name)}</span><span class="st">${c.n ? `${c.n} · ${c.out ? '£' + Core.fmt(c.out) : '+£' + Core.fmt(c.inn)}` : '—'}</span>`
      + `<span class="go"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg></span></div>`).join('')
      + `<div class="crow add" id="newCatRow"><span>+</span><span>New category</span></div>`
      + `<button class="editbtn" id="editCats">Edit categories</button>`;
  }
  if (state.catView.open != null) renderCatPanel();
}
$('#catBody').addEventListener('change', e => {
  const row = e.target.closest('.prow');
  if (row && e.target.tagName === 'SELECT') { ruleWithUndo(row.dataset.k, e.target.value || null); return; }
  const chip = e.target.closest('.chip[data-id]');
  if (chip) {
    const c = catById(chip.dataset.id);
    if (e.target.type === 'color') c.color = e.target.value;
    if (e.target.type === 'text' && e.target.value.trim()) c.name = e.target.value.trim();
    changed();
  }
});
$('#catBody').addEventListener('click', e => {
  const ok = e.target.closest('.ok');
  if (ok) { const row = ok.closest('.prow'); ruleWithUndo(row.dataset.k, row.querySelector('select').value || null); return; }
  if (e.target.closest('#moreBtn')) { state.catView.shown += 12; buildCats(); return; }
  const subMore = e.target.closest('[data-sub]');
  if (subMore) { const k = subMore.dataset.sub; state.catView.expanded.set(k, state.catView.expanded.get(k) + 50); buildCats(); return; }
  const subRow = e.target.closest('.psub .cp-r');
  if (subRow) {
    const t = state.catView.subRows.get(subRow.closest('.psub').dataset.k)[+subRow.dataset.i];
    if (t.src === 'pdf') openPdf(t); else toast('From the CSV — no statement for this month yet');
    return;
  }
  const head = e.target.closest('.prow .nm, .prow .st');
  if (head) {
    const k = head.closest('.prow').dataset.k;
    if (state.catView.expanded.has(k)) state.catView.expanded.delete(k); else state.catView.expanded.set(k, 30);
    buildCats(); return;
  }
  if (e.target.closest('#editCats')) { state.catView.editing = !state.catView.editing; buildCats(); return; }
  const del = e.target.closest('.chip .del');
  if (del) { deleteCategory(del.closest('.chip').dataset.id); return; }
  if (e.target.closest('#newCatRow')) { state.catView.editing = true; $('#addCat') || buildCats(); $('#addCat').click(); return; }
  const crow = e.target.closest('.crow');
  if (crow) { openCatPanel(crow.dataset.cat); return; }
  if (e.target.closest('#addCat')) {
    const { id } = newCategory('New category');
    changed(); const inp = $(`.chip[data-id="${id}"] input[type=text]`); if (inp) { inp.focus(); inp.select(); }
  }
});
$('#catTabs').addEventListener('click', e => { const b = e.target.closest('button'); if (b) { state.catView.tab = b.dataset.t; buildCats(); } });
$('#refundBtn').onclick = () => { state.catView.refunds = !state.catView.refunds; ls.set('refunds', state.catView.refunds); buildCats(); drawRows(); };

// Totals per category id ('' = uncategorised) for a set of transactions.
function catTotals(tx) {
  const tot = new Map();
  for (const t of tx) {
    const id = (state.catOf.get(t.key) || {}).cat || '';
    if (!tot.has(id)) tot.set(id, { n: 0, out: 0, inn: 0 });
    const x = tot.get(id); x.n++; if (t.amount < 0) x.out -= t.amount; else x.inn += t.amount;
  }
  return tot;
}

// ---------- Spending tile: ring by category + monthly bars, for the timeline's range ----------
let pieChart = null, barChart = null;
const UNCAT = { id: '', name: 'Uncategorised', color: '#d5d9e1' };
const catOrUncat = id => catById(id) || UNCAT;

function buildCharts() {
  if (!state.merged || !window.echarts) return;
  if (!pieChart) {
    pieChart = echarts.init($('#pie')); barChart = echarts.init($('#bars'));
    pieChart.on('click', p => { if (p.data) openCatPanel(p.data.id); });
    pieChart.on('legendselectchanged', p => {
      const id = state.data.categories.find(c => c.name === p.name)?.id ?? (p.name === UNCAT.name ? '' : null);
      if (id == null) return;
      p.selected[p.name] ? state.chartHidden.delete(id) : state.chartHidden.add(id);
      ls.set('chartHidden', [...state.chartHidden]);
      buildCharts();
    });
    barChart.on('click', p => {
      const m = barMonths[p.dataIndex]; if (!m) return;
      const from = m + '-01', to = Core.addDays(Core.addMonths(from, 1), -1), r = state.view.range;
      openCatPanel(p.seriesId, { from: r && r.from > from ? r.from : from, to: r && r.to < to ? r.to : to });
    });
    window.addEventListener('resize', () => { pieChart.resize(); barChart.resize(); });
  }
  const tx = Core.inRange(state.merged.tx, state.view.range);
  const catFn = t => (state.catOf.get(t.key) || {}).cat;
  const isRefund = t => t.amount > 0 && state.refunds.has(t.key);
  const totals = Core.spendTotals(tx, catFn, isRefund);
  const shown = [...totals].filter(([id]) => !state.chartHidden.has(id)).reduce((a, [, v]) => a + v, 0);
  const r = state.view.range;
  $('#spendLbl').textContent = r ? `${shortDate(r.from)} – ${shortDate(r.to)}` : 'All dates';

  const slices = [...totals].map(([id, v]) => { const c = catOrUncat(id); return { id, name: c.name, value: v / 100, itemStyle: { color: c.color } }; })
    .sort((a, b) => b.value - a.value);
  const selected = Object.fromEntries(slices.map(x => [x.name, !state.chartHidden.has(x.id)]));
  pieChart.setOption({
    animation: false,
    title: { text: '£' + compact(shown / 100), subtext: 'spent', left: 'center', top: '33%',
      textStyle: { fontSize: 20, fontWeight: 650, color: '#1d2330' }, subtextStyle: { fontSize: 11, color: '#8a92a3' }, itemGap: 2 },
    tooltip: { trigger: 'item', confine: true, backgroundColor: '#fff', borderColor: '#e8ebf0', textStyle: { color: '#1d2330', fontSize: 12 },
      formatter: p => `<b>${esc(p.name)}</b><br>£${Core.fmt(Math.round(p.value * 100))} · ${p.percent}%`,
      extraCssText: 'box-shadow:0 6px 20px rgba(20,30,50,.12);border-radius:10px;' },
    legend: { type: 'scroll', bottom: 0, left: 8, right: 8, itemWidth: 9, itemHeight: 9, icon: 'circle', itemGap: 10,
      textStyle: { fontSize: 11, color: '#4a5263' }, pageIconSize: 9, selected },
    series: [{ type: 'pie', radius: ['48%', '70%'], center: ['50%', '40%'], avoidLabelOverlap: true, minAngle: 2,
      itemStyle: { borderColor: '#fff', borderWidth: 2 }, label: { show: false }, emphasis: { scale: true, scaleSize: 5 },
      data: slices }],
  }, true);

  const sm = Core.spendByMonth(tx, catFn, isRefund);
  barMonths = sm.months;
  const order = [...sm.byCat.keys()].sort((a, b) => (totals.get(b) || 0) - (totals.get(a) || 0));
  barChart.setOption({
    animation: false,
    grid: { left: 8, right: 48, top: 16, bottom: 24 },
    tooltip: { trigger: 'axis', axisPointer: { type: 'shadow', shadowStyle: { color: 'rgba(59,110,245,.06)' } }, confine: true,
      backgroundColor: '#fff', borderColor: '#e8ebf0', textStyle: { color: '#1d2330', fontSize: 12 },
      extraCssText: 'box-shadow:0 6px 20px rgba(20,30,50,.12);border-radius:10px;',
      formatter: ps => {
        const rows = ps.filter(p => p.value > 0).sort((a, b) => b.value - a.value);
        const sum = rows.reduce((a, p) => a + p.value, 0);
        return `<b>${esc(ps[0].axisValue)}</b> · £${Core.fmt(Math.round(sum * 100))}<br>` + rows.slice(0, 8).map(p => `${p.marker}${esc(p.seriesName)} £${Core.fmt(Math.round(p.value * 100))}`).join('<br>') + (rows.length > 8 ? `<br><span style="color:#8a92a3">and ${rows.length - 8} more</span>` : '');
      } },
    xAxis: { type: 'category', data: sm.months.map(m => `${MONTHS[+m.slice(5) - 1]} ${m.slice(2, 4)}`), axisTick: { show: false },
      axisLine: { lineStyle: { color: '#e8ebf0' } }, axisLabel: { color: '#8a92a3', fontSize: 11, hideOverlap: true } },
    yAxis: { type: 'value', position: 'right', splitNumber: 3, axisLabel: { color: '#8a92a3', fontSize: 11, formatter: v => '£' + compact(v) },
      splitLine: { lineStyle: { color: '#f1f3f6' } } },
    series: order.filter(id => !state.chartHidden.has(id)).map(id => { const c = catOrUncat(id); return {
      id, name: c.name, type: 'bar', stack: 'spend', barMaxWidth: 28, itemStyle: { color: c.color }, emphasis: { focus: 'series' },
      data: sm.byCat.get(id).map(v => v / 100) }; }),
  }, true);
}
let barMonths = [];

// ---------- Category panel: every payment in one category, in the timeline's range ----------
function openCatPanel(id, range) {
  if (pieChart) { pieChart.dispatchAction({ type: 'hideTip' }); barChart.dispatchAction({ type: 'hideTip' }); }
  state.catView.open = id;
  state.catView.panelRange = range || null;
  renderCatPanel();
  $('#catPanel').classList.add('open'); $('#catPanel').setAttribute('aria-hidden', 'false');
  $('#cpBody').scrollTop = 0;
}
function closeCatPanel() { state.catView.open = null; state.catView.panelRange = null; $('#catPanel').classList.remove('open'); $('#catPanel').setAttribute('aria-hidden', 'true'); }

function renderCatPanel() {
  const id = state.catView.open;
  if (id == null || !state.merged) return;
  const c = catById(id), r = state.catView.panelRange || state.view.range;
  const tx = Core.inRange(state.merged.tx, r).filter(t => ((state.catOf.get(t.key) || {}).cat || '') === id).reverse();
  const out = tx.reduce((a, t) => a + (t.amount < 0 ? -t.amount : 0), 0), inn = tx.reduce((a, t) => a + (t.amount > 0 ? t.amount : 0), 0);
  $('#cpDot').className = 'cdot' + (c ? '' : ' none'); $('#cpDot').style.background = c ? c.color : 'transparent';
  $('#cpName').textContent = c ? c.name : 'Uncategorised';
  $('#cpSub').textContent = `${r ? shortDate(r.from) + ' – ' + shortDate(r.to) : 'All dates'} · ${tx.length} · £${Core.fmt(out)} out${inn ? ` · £${Core.fmt(inn)} in` : ''}`;
  let h = '', month = null;
  const monthTotal = m => tx.filter(t => t.date.slice(0, 7) === m).reduce((a, t) => a + t.amount, 0);
  tx.forEach((t, i) => {
    const m = t.date.slice(0, 7);
    if (m !== month) { month = m; h += `<div class="cp-m"><span>${MONTHS[+m.slice(5) - 1]} ${m.slice(0, 4)}</span><span>${Core.fmt(monthTotal(m), true)}</span></div>`; }
    const partner = state.catView.refunds && state.refunds.get(t.key);
    h += `<div class="cp-r ${t.src} ${partner ? 'refund' : ''}" data-i="${i}" title="${t.src === 'pdf' ? 'Show on statement' : 'From CSV'}">`
      + `<span class="d">${+t.date.slice(8)} ${MONTHS[+t.date.slice(5, 7) - 1]}</span>`
      + `<span class="nm">${(L => L.length ? esc(L[0]) + (L.length > 1 ? `<i>${esc(L.slice(1).join(' · '))}</i>` : '') : esc(TYPES[t.type] || t.type))(showLines(t))}</span>`
      + `<span class="a ${t.amount > 0 ? 'in' : ''}">${Core.fmt(t.amount, true)}</span></div>`;
  });
  $('#cpBody').innerHTML = h || '<div class="empty-note">Nothing in this category in the selected dates.</div>';
  $('#cpBody').onclick = e => {
    const row = e.target.closest('.cp-r'); if (!row) return;
    const t = tx[+row.dataset.i];
    if (t.src === 'pdf') openPdf(t); else toast('From the CSV — no statement for this month yet');
  };
}
$('#cpClose').onclick = closeCatPanel;

// ---------- PDF panel ----------
// Pages are laid out (sized) first and the highlight placed at once; drawing happens after,
// target page first. A draw lost while the app was hidden is retried when it is visible again,
// so the panel never waits on a draw that will not finish (rAF hidden-tab trap).
const pdfDocs = new Map();
async function openPdf(t) {
  const panel = $('#pdfPanel'), body = $('#pdfBody');
  panel.classList.add('open'); panel.setAttribute('aria-hidden', 'false');
  $('#pdfName').textContent = t.file;
  $('#pdfSub').textContent = `${shortDate(t.date)} · ${showLines(t)[0] || TYPES[t.type] || ''} · ${Core.fmt(t.amount, true)} · page ${t.page}`;
  if (body.dataset.file !== t.file) {
    body.dataset.file = t.file; body.innerHTML = '';
    if (!pdfDocs.has(t.file)) {
      const blob = await Store.blob(t.file);
      if (!blob) { toast('That statement is no longer in the folder'); return; }
      pdfDocs.set(t.file, pdfjsLib.getDocument({ data: new Uint8Array(await blob.arrayBuffer()), verbosity: 0 }).promise);
    }
    const doc = await pdfDocs.get(t.file);
    if (body.dataset.file !== t.file) return;               // another statement was opened meanwhile
    const cssW = body.clientWidth - 24;
    for (let n = 1; n <= doc.numPages; n++) {
      const vp1 = (await doc.getPage(n)).getViewport({ scale: 1 }), s = cssW / vp1.width;
      const holder = document.createElement('div');
      holder.className = 'page'; holder.dataset.n = n; holder.dataset.s = s;
      holder.style.width = cssW + 'px'; holder.style.height = vp1.height * s + 'px';
      body.appendChild(holder);
    }
    drawPages(t.file, t.page);
  }
  placeHighlight(t);
}

async function drawPages(file, first) {
  const body = $('#pdfBody'), doc = await pdfDocs.get(file);
  const holders = [...body.querySelectorAll('.page')].sort((a, b) => (+b.dataset.n === first) - (+a.dataset.n === first));
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  for (const h of holders) {
    if (body.dataset.file !== file || h.dataset.done || h.dataset.busy || document.hidden) continue;
    h.dataset.busy = 1;
    try {
      const pg = await doc.getPage(+h.dataset.n), vp = pg.getViewport({ scale: +h.dataset.s * dpr });
      const cv = document.createElement('canvas'); cv.width = vp.width; cv.height = vp.height;
      const ok = await Promise.race([pg.render({ canvasContext: cv.getContext('2d'), viewport: vp }).promise.then(() => true),
        new Promise(r => setTimeout(() => r(false), 8000))]);
      if (ok) { h.querySelector('canvas')?.remove(); h.prepend(cv); h.dataset.done = 1; }
    } catch (e) { /* left undrawn; retried on the next visibility change */ }
    delete h.dataset.busy;
  }
}
document.addEventListener('visibilitychange', () => { const f = $('#pdfBody').dataset.file; if (!document.hidden && f && pdfDocs.has(f)) drawPages(f, 1); });

function placeHighlight(t) {
  const body = $('#pdfBody');
  const holder = body.querySelector(`.page[data-n="${t.page}"]`);
  if (!holder) return;
  body.querySelectorAll('.hlbox').forEach(e => e.remove());
  const s = +holder.dataset.s, [x0, y0, x1, y1] = t.box;
  const hl = document.createElement('div');
  hl.className = 'hlbox';
  Object.assign(hl.style, { left: x0 * s + 'px', top: y0 * s + 'px', width: (x1 - x0) * s + 'px', height: (y1 - y0) * s + 'px' });
  holder.appendChild(hl);
  body.scrollTo({ top: holder.offsetTop + y0 * s - body.clientHeight / 2 + 40, behavior: 'smooth' });
}

function closePdf() { $('#pdfPanel').classList.remove('open'); $('#pdfPanel').setAttribute('aria-hidden', 'true'); }

// ---------- System panel ----------
const gem = ok => ok ? '🟢' : '🔴';
const pct = (a, b) => b ? ` (${Math.round(a / b * 1000) / 10}%)` : '';
function openSystem() {
  const m = state.merged, s = m && m.stats;
  let h = `<h3>System</h3><div class="stamp">${STAMP} · parser v${Core.PARSER_VERSION}</div>`;
  h += `<div class="note">Storage: ${esc(Store.label)}${Store.folderName() ? ' · ' + esc(Store.folderName()) : ''}</div>`;
  if (m) {
    h += `<table><tr><th>Statement</th><th class="num">Entries</th><th>Day balances</th><th>Totals</th><th></th></tr>`;
    for (const st of m.statements) {
      const c = st.checks;
      h += `<tr><td>${shortDate(st.period.from)} – ${shortDate(st.period.to)}</td><td class="num">${st.tx.length}</td>`
        + `<td>${c.dayBalances.ok} of ${c.dayBalances.total}${pct(c.dayBalances.ok, c.dayBalances.total)}</td>`
        + `<td>${gem(c.totalIn.ok && c.totalOut.ok && c.opening.ok && c.closing.ok)}</td><td>${gem(st.ok)}</td></tr>`;
      if (st.issues.length) h += `<tr><td colspan="5"><details><summary>${st.issues.length} issue(s)</summary>${st.issues.map(esc).join('<br>')}</details></td></tr>`;
    }
    for (const c of state.csvs) h += `<tr><td>CSV ${shortDate(c.from)} – ${shortDate(c.to)}</td><td class="num">${c.tx.length}</td><td>${c.checks.chain.ok} of ${c.checks.chain.total}${pct(c.checks.chain.ok, c.checks.chain.total)}</td><td></td><td>${gem(c.ok)}</td></tr>`;
    h += `</table><table>`
      + `<tr><td>Statement entries also in a CSV</td><td class="num">${s.matched}</td><td>${gem(true)}</td></tr>`
      + `<tr><td>CSV entries missing from their statement</td><td class="num">${s.csvOnly}</td><td>${gem(!s.csvOnly)}</td></tr>`
      + `<tr><td>Statement entries missing from the CSV</td><td class="num">${s.pdfUnmatched}</td><td>${gem(!s.pdfUnmatched)}</td></tr>`
      + `<tr><td>Entries only in a CSV (no statement yet)</td><td class="num">${s.fromCsv - s.csvOnly}</td><td></td></tr>`
      + `<tr><td>Breaks in the running balance</td><td class="num">${s.breaks}</td><td>${gem(s.breaks <= m.gaps.length + (s.csvOnly ? 1 : 0))}</td></tr>`
      + `</table>`;
    if (m.gaps.length) h += `<div class="note">Gaps: ${m.gaps.map(g => g.kind === 'missing' ? `no statement ${shortDate(g.from)} – ${shortDate(g.to)}` : `balance jumps at ${shortDate(g.at)}`).join('; ')}</div>`;
    if (state.ignored.length) h += `<details><summary>${state.ignored.length} file(s) ignored</summary>${state.ignored.map(f => esc(f.name + ' — ' + f.why)).join('<br>')}</details>`;
  }
  h += `<div class="btns"><button id="sysPick">Choose folder</button>${Store.kind === 'copy' ? '<button id="sysExport">Download data file</button>' : ''}<button id="sysClose">Close</button></div>`;
  $('#sysBody').innerHTML = h;
  $('#sysClose').onclick = () => $('#sysDlg').close();
  $('#sysPick').onclick = () => { $('#sysDlg').close(); pickFolder(); };
  if ($('#sysExport')) $('#sysExport').onclick = exportData;
  $('#sysDlg').showModal();
}

async function exportData() { await CopyDriver.exportData(state.data); state.dirty = false; paintChrome(); }

let toastT;
function toast(msg, undo) {
  const t = $('#toast'); t.textContent = msg;
  if (undo) { const b = document.createElement('button'); b.textContent = 'Undo'; b.onclick = () => { t.classList.remove('on'); undo(); }; t.appendChild(b); }
  t.classList.add('on'); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove('on'), undo ? 6000 : 2600);
}

// ---------- Wiring ----------
async function pickFolder() {
  try { if (await Store.pick()) { pdfDocs.clear(); $('#pdfBody').dataset.file = ''; await loadAll(); } }
  catch (e) { if (e.name !== 'AbortError') toast(e.message); }
}

async function start() {
  const st = await Store.restore().catch(() => 'none');
  if (st === 'ready') await loadAll();
  else if (st === 'permission') emptyState('Reconnect statements folder');
  else emptyState('Choose statements folder');
}

$('#btnStart').onclick = async () => {
  if (Store.kind === 'folder' && Store.handle && $('#btnStart span').textContent.startsWith('Reconnect')) {
    if (await Store.reconnect()) return loadAll();
  }
  pickFolder();
};
$('#btnFolder').onclick = pickFolder;
$('#btnReload').onclick = () => loadAll();
$('#btnSystem').onclick = openSystem;
$('#btnSave').onclick = exportData;
$('#pdfClose').onclick = closePdf;
$('#presets').addEventListener('click', e => { const b = e.target.closest('button'); if (b) applyPreset(b.dataset.p); });
$('#payBtn').onclick = () => { state.view.paydays = !state.view.paydays; ls.set('paydays', state.view.paydays); buildTimeline(); };
document.addEventListener('keydown', e => { if (e.key !== 'Escape') return; if (pickFor) closePicker(); else if ($('#pdfPanel').classList.contains('open')) closePdf(); else closeCatPanel(); });
$('#txList').addEventListener('scroll', () => requestAnimationFrame(drawRows), { passive: true });
window.addEventListener('resize', () => drawRows());
$('#q').addEventListener('input', e => { state.view.q = e.target.value; $('#txList').scrollTop = 0; buildRows(); });
$('#sortBtn').onclick = () => { state.view.desc = !state.view.desc; ls.set('sortDesc', state.view.desc); buildRows(); };
$('#txList').addEventListener('click', e => {
  const r = e.target.closest('.row'); if (!r) return;
  const t = state.view.rows[+r.dataset.i];
  if (e.target.closest('.cdot')) { e.stopPropagation(); openPicker(t, e.target.closest('.cdot')); return; }
  state.view.sel = t.key; drawRows();
  if (t.src === 'pdf') openPdf(t); else toast(t.flag ? 'In the CSV but not on its statement' : 'From the CSV — no statement for this month yet');
});
document.querySelectorAll('.tile').forEach(tile => {
  const k = 'collapsed.' + tile.dataset.tile;
  tile.classList.toggle('collapsed', ls.get(k, false));
  tile.querySelector('.chev').onclick = () => {
    tile.classList.toggle('collapsed'); ls.set(k, tile.classList.contains('collapsed'));
    if (chart && tile.dataset.tile === 'timeline') chart.resize();
    if (pieChart && tile.dataset.tile === 'charts') { pieChart.resize(); barChart.resize(); }
  };
});

if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js', { updateViaCache: 'none' }).catch(() => {});

// Stale-build guard. Read the stamp of the copy on the server with cache: 'no-store' (no browser or
// offline cache can answer). If it is newer than the build that is running, drop the offline cache,
// refresh the service worker and load the new build once, at a URL no cache has seen.
// Bank data lives in IndexedDB, which this never touches.
function liveStamp(html) { return (/const STAMP = '([^']+)'/.exec(html) || [])[1] || null; }
async function checkForUpdate() {
  if (location.protocol !== 'https:' || !navigator.onLine) return;
  try {
    const live = liveStamp(await (await fetch('./?stamp=' + Date.now(), { cache: 'no-store' })).text());
    if (!live || live === STAMP || sessionStorage.getItem('spend.updatedTo') === live) return;
    sessionStorage.setItem('spend.updatedTo', live);
    if ('caches' in window) for (const k of await caches.keys()) await caches.delete(k);
    const reg = navigator.serviceWorker && await navigator.serviceWorker.getRegistration();
    if (reg) await reg.update().catch(() => {});
    const u = new URL(location.href); u.searchParams.set('v', live);
    location.replace(u.toString());
  } catch (e) { /* offline or blocked: carry on with the build we have */ }
}

start();
checkForUpdate();
